[workspace]
members = [
    "crates/memos",
    "crates/memos-core",
    "crates/memos-api",
    "crates/memos-storage",
    "crates/memos-index",
    "crates/memos-lifecycle",
    "crates/memos-train",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Memos Team"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }