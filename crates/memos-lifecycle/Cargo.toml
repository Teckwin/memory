[package]
name = "memos-lifecycle"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Lifecycle management for memos - Memory Management System"
documentation = "https://github.com/Teckwin/memory"
repository = "https://github.com/Teckwin/memory"
readme = "../../README.md"

[dependencies]
memos-core = { version = "0.1.0", path = "../memos-core" }
memos-storage = { version = "0.1.0", path = "../memos-storage" }
tokio = { workspace = true, features = ["sync", "time"] }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
