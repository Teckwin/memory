# Rust Project Setup

[workspace]
members = [
    "crates/memory-core",
    "crates/memory-api",
    "crates/memory-storage",
    "crates/memory-index",
    "crates/memory-lifecycle",
    "crates/memory-train",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Memory Team"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 0
debug = false

# RUSTFMT
rustfmt edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
use_small_heuristics = "Default"
reorder_imports = true
reorder_modules = true
remove_nested_parens = true
format_strings = true
normalize_comments = true
wrap_comments = true
comment_width = 80
format_code_in_doc_comments = true

# CLIPPY
[clippy]
msrv = "1.70"
too_many_arguments_threshold = 8
type_complexity_threshold = 500
single_char_binding_names_threshold = 4
avoid-breaking-exported-api = true
warn-on-all-wildcard-imports = true